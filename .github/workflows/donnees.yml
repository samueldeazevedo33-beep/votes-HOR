name: Rafraichir les donnees

on:
  schedule:
    # Tous les lundis a 6h00 UTC. L'Assemblee regenere ses fichiers chaque nuit.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Construire le jeu de donnees
        env:
          AMENDEMENTS_FEED_URL: ${{ secrets.AMENDEMENTS_FEED_URL }}
        run: python3 scripts/build_data.py

      - name: Publier si les votes ont change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/data/votes.json; then
            echo "Aucun scrutin nouveau."
            exit 0
          fi
          git add docs/data/votes.json
          git commit -m "Donnees: rafraichissement des scrutins budgetaires"
          git push
